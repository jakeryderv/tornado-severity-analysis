[project]
name = "tornado-severity-analysis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.1.4",
    "ipykernel>=7.3.0",
    "joblib>=1.6.0",
    "jupyter>=1.1.1",
    "kagglehub>=1.0.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "tensorflow>=2.21.0",
]

[project.optional-dependencies]
gpu = ["tensorflow[and-cuda]>=2.21.0; sys_platform == 'linux'"]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
    "ty>=0.0.81",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Configure the local Matplotlib cache before importing plotting libraries.
"*.ipynb" = ["E402"]

[tool.ty.src]
include = ["notebook.ipynb"]
